name: Build and Publish Intel

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-intel.yml'
      - 'intel.Dockerfile'
  # Schedule temporarily disabled
  #schedule:
    # Weekly refresh of the base layer
    #- cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full llama.cpp commit SHA to build (empty = latest master HEAD).'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/llama.cpp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - tag: intel
            fp16: "OFF"
          - tag: intel-fp16
            fp16: "ON"
          - tag: intel-arl-fp16
            fp16: "ON"
            device_arch: "arl_h"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve build config
        id: cfg
        env:
          COMMIT_INPUT: ${{ inputs.commit }}
          MATRIX_TAG: ${{ matrix.tag }}
        run: |
          if [ -n "$COMMIT_INPUT" ]; then
            COMMIT="$COMMIT_INPUT"
            TAG="${COMMIT:0:7}-${MATRIX_TAG}"
            echo "Pinned build: commit=$COMMIT tag=$TAG"
          else
            COMMIT=""
            TAG="latest-${MATRIX_TAG}"
            echo "Latest build: tag=$TAG (shallow HEAD)"
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./intel.Dockerfile 
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.cfg.outputs.tag }}
          # Caches temporarily disabled
          #no-cache-filters: ${{ github.event_name == 'schedule' && 'base' || '' }}
          #cache-from: type=gha,scope=${{ matrix.tag }}
          #cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
          build-args: |
            LLAMA_CPP_COMMIT=${{ steps.cfg.outputs.commit }}
            GGML_SYCL_F16=${{ matrix.fp16 }}
            GGML_SYCL_DEVICE_ARCH=${{ matrix.device_arch }}
