name: Build and Publish Intel

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-intel.yml'
      - 'intel.Dockerfile'
  schedule:
    # Weekly refresh of the base layer
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/llama.cpp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - tag: latest-intel
            fp16: "OFF"
          - tag: latest-intel-fp16
            fp16: "ON"
          - tag: latest-intel-arl-fp16
            fp16: "ON"
            device_arch: "arl_h"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get latest llama.cpp commit
        id: llama-commit
        run: |
          COMMIT=$(git ls-remote https://github.com/ggml-org/llama.cpp.git HEAD | cut -f1)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "Latest llama.cpp commit: $COMMIT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./intel.Dockerfile 
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
          # On the weekly schedule, ignore cache for the base stage
          no-cache-filters: ${{ github.event_name == 'schedule' && 'base' || '' }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
          build-args: |
            LLAMA_CPP_COMMIT=${{ steps.llama-commit.outputs.commit }}
            GGML_SYCL_F16=${{ matrix.fp16 }}
            GGML_SYCL_DEVICE_ARCH=${{ matrix.device_arch }}
