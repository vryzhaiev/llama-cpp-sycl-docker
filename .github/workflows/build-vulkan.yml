name: Build and Publish Vulkan

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-vulkan.yml'
      - 'vulkan.Dockerfile'
  schedule:
    # Weekly refresh of the base and runner stages
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full llama.cpp commit SHA to build (empty = latest master HEAD).'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/llama.cpp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve build config
        id: cfg
        env:
          COMMIT_INPUT: ${{ inputs.commit }}
        run: |
          if [ -n "$COMMIT_INPUT" ]; then
            COMMIT="$COMMIT_INPUT"
            TAG="${COMMIT:0:7}-vulkan"
            PINNED=true
            echo "Pinned build: commit=$COMMIT tag=$TAG"
          else
            COMMIT=$(git ls-remote https://github.com/ggml-org/llama.cpp.git HEAD | cut -f1)
            TAG="latest-vulkan"
            PINNED=false
            echo "Latest build: commit=$COMMIT tag=$TAG"
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./vulkan.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.cfg.outputs.tag }}
          # On the weekly schedule, ignore cache for the base and runner stages so they refresh
          no-cache-filters: ${{ github.event_name == 'schedule' && 'base,runner' || '' }}
          # Cache only for latest builds; a pinned commit builds fully cold (no import/export)
          cache-from: ${{ steps.cfg.outputs.pinned == 'false' && 'type=gha,scope=vulkan' || '' }}
          cache-to: ${{ steps.cfg.outputs.pinned == 'false' && 'type=gha,mode=min,scope=vulkan' || '' }}
          build-args: |
            LLAMA_CPP_COMMIT=${{ steps.cfg.outputs.commit }}
