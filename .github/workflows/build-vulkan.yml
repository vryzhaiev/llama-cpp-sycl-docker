name: Build and Publish Vulkan

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-vulkan.yml'
      - 'vulkan.Dockerfile'
  schedule:
    # Weekly refresh of the base and runner stages
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/llama.cpp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get latest llama.cpp commit
        id: llama-commit
        run: |
          COMMIT=$(git ls-remote https://github.com/ggml-org/llama.cpp.git HEAD | cut -f1)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "Latest llama.cpp commit: $COMMIT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./vulkan.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-vulkan
          # On the weekly schedule, ignore cache for the base and runner stages
          no-cache-filters: ${{ github.event_name == 'schedule' && 'base,runner' || '' }}
          cache-from: type=gha,scope=vulkan
          cache-to: type=gha,mode=min,scope=vulkan
          build-args: |
            LLAMA_CPP_COMMIT=${{ steps.llama-commit.outputs.commit }}
